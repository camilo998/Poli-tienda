<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos</title>
  <link rel="stylesheet" href="productos.css">
</head>
<body>
  <header>
    <nav class="header">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQhdZ7otWyIFAqBIoiqyrbRJNRRL0_m44F36g&s" alt="logo" class="logo">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="productos.html">Productos</a></li>
      <li><a href="contacto.html">Contacto</a></li>
    </nav>
  </header>

  <h1>Productos</h1>

  <!-- Productos dinámicos -->
  <div class="contenedor_productos" id="contenedor_productos">
    <!-- Se llenará con fetch -->
  </div>
    
  <!-- Botón carrito -->
  <div class="carro-container">
    <button class="carro" onclick="mostrarCuadrado()">🛒</button>
  </div>

  <!-- Cuadro del carrito -->
  <div id="miCuadrado">
    <button class="cerrar" onclick="cerrarCuadrado()">❌</button>
    <h1>Aquí se mostrarán los productos futuramente</h1>
  </div>

  <script>
    async function cargarProductos() {
      try {
        const res = await fetch('/api/productos');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const productos = data.data || [];

        const contenedor = document.getElementById('contenedor_productos');
        contenedor.innerHTML = '';

        if (productos.length === 0) {
          contenedor.innerHTML = '<p>No hay productos disponibles.</p>';
          return;
        }

        productos.forEach((p) => {
          const div = document.createElement('div');
          div.className = 'items';
          div.innerHTML = `
            <img src="${p.ImagenUrl || 'https://via.placeholder.com/200'}" alt="foto-gato" class="foto-gato">
            <h2>${p.Nombre}</h2>
            <p>Precio: $${p.Precio}</p>
            <p>${p.Descripcion || ''}</p>
            <button>Ver detalles</button>
            <button>AÑADEME AL CARRO</button>
          `;
          contenedor.appendChild(div);
        });
      } catch (err) {
        console.error('Error al cargar productos:', err);
        const contenedor = document.getElementById('contenedor_productos');
        contenedor.innerHTML = '<p style="color:red">Error al cargar productos.</p>';
      }
    }

    function mostrarCuadrado() {
      var x = document.getElementById("miCuadrado");
      x.style.display = "flex";
    }

    function cerrarCuadrado() {
      var x = document.getElementById("miCuadrado");
      x.style.display = "none";
    }

    window.addEventListener('DOMContentLoaded', cargarProductos);
  </script>
</body>
</html>
